<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<script>/* start-up mode: the first launch boots MENU-ONLY (hero + sky + menus, no city assets); Play reloads with ?go into the full boot, which builds
   the city and starts the game by itself. ?eager (or ?shot / ?playtest / ?nomenu / ?noboot / ?cam / ?vp) keeps the old behaviour: build everything first. */
try{var q0=new URLSearchParams(location.search);globalThis.__GO=q0.has('go');globalThis.__MENU_ONLY=!(globalThis.__GO||['eager','shot','playtest','nomenu','noboot','cam','vp'].some(function(k){return q0.has(k)}))}catch(e){}
try{var u=new URL(location.href);if(matchMedia("(pointer:coarse)").matches&&!u.searchParams.has("q")){u.searchParams.set("q","low");history.replaceState(null,"",u)}var c=matchMedia("(pointer:coarse)").matches;if(u.searchParams.has("lite"))globalThis.__LITE_R=+u.searchParams.get("lite")||1300;else if(c&&!u.searchParams.has("full"))globalThis.__LITE_R=500}catch(e){}
/* options screen: saved world radius + crowd size (settings.gfx), read before anything is built */
try{var st=JSON.parse(localStorage.getItem('spiderbench.save.v1')||'null'),g=st&&st.settings&&st.settings.gfx;if(g){var u2=new URL(location.href);
if(!u2.searchParams.has('lite')&&!u2.searchParams.has('full')){var R={low:500,medium:1300,high:2200,full:0}[g.drawDist];if(R===0)delete globalThis.__LITE_R;else if(R)globalThis.__LITE_R=R}
var P={off:.001,low:.35,medium:.8,high:1}[g.population];if(P)globalThis.__POP_SCALE=P;var T={off:0,low:.4,medium:1,high:1.4}[g.traffic];if(T!=null)globalThis.__TRAFFIC_SCALE=T;globalThis.__PARK_KEEP=T==null?1:Math.min(1,T)*.75;var B={normal:1,sparse:.6,verysparse:.35}[g.buildings];if(B)globalThis.__BLD_KEEP=B}else if(matchMedia('(pointer:coarse)').matches){globalThis.__POP_SCALE=.35;globalThis.__TRAFFIC_SCALE=.4;globalThis.__PARK_KEEP=.3;globalThis.__LOD_NEAR=100;globalThis.__LOD_FAR=260}}catch(e){}</script>
<title>Spiderbench</title>
<link rel="icon" href="data:," />
<link rel="preload" as="image" href="/assets/ui/menu/logo.png" fetchpriority="high" />
<link rel="stylesheet" id="sys-fonts" href="/assets/ui/fonts/fonts.css" /><!-- the one fonts.css link (src/ui/fonts.js loadFonts() keeps it single) -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}
/* ---- Overpeak-style startup + Play loader (shared by #boot and #ld, built by window.__ob below) ----
   black screen, current asset name bottom-left, the logo filling in bottom-right, a thick red bar along the bottom edge.
   Everything that moves is a CSS animation / transform, so it keeps going while the city build blocks the main thread. */
.ob{--red:#f00;position:fixed;inset:0;z-index:1000;background:#000;color:#fff;overflow:hidden;user-select:none;cursor:progress;
  font-family:'Spiderbench Sans',Manrope,system-ui,sans-serif;transition:opacity .6s ease}
.ob.out{opacity:0;pointer-events:none}
.ob .bar{position:absolute;left:0;right:0;bottom:0;height:clamp(10px,4vh,40px);background:#333}
.ob .bar i{position:absolute;inset:0;background:var(--red);transform-origin:0 50%;transform:scaleX(0);will-change:transform}
.ob .asset{position:absolute;left:clamp(16px,1.5vw,32px);bottom:calc(clamp(10px,4vh,40px) + clamp(10px,2.4vh,26px));height:1.5em;overflow:hidden;
  font:700 clamp(14px,3vh,28px)/1.5 'Spiderbench Sans',system-ui,sans-serif;color:#555;letter-spacing:.01em;white-space:nowrap}
.ob .asset ul{margin:0;padding:0;list-style:none;animation:obTick calc(var(--n) * .42s) steps(var(--n)) infinite;animation-delay:var(--d,0s)}
.ob .asset li{height:1.5em}
@keyframes obTick{to{transform:translate3d(0,calc(-1.5em * var(--n)),0)}}
.ob .logo{position:absolute;right:clamp(16px,2.4vw,48px);bottom:calc(clamp(10px,4vh,40px) + clamp(10px,2.4vh,26px));width:clamp(120px,15vw,240px);aspect-ratio:1982/365}
.ob .logo img,.ob .logo b{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;object-position:right bottom}
.ob .logo b{font:800 clamp(18px,3.4vh,32px)/1 'Spiderbench Condensed','Arial Narrow',sans-serif;text-align:right;letter-spacing:.02em}
.ob .logo .base{opacity:.16}
.ob .logo .fill{position:absolute;inset:0;clip-path:inset(0 100% 0 0);transition:clip-path .35s ease-out}
.ob .msg{display:none;position:absolute;left:clamp(16px,1.5vw,32px);right:clamp(16px,2.4vw,48px);top:clamp(20px,5vh,56px);font:500 14px/1.45 'Spiderbench Sans',sans-serif;color:#ff8a8f;overflow-wrap:anywhere}
.ob.err .msg{display:block}.ob.err .bar i{background:#9e1017}
/* intro cards (startup only): pure CSS timeline, plays over the loader and fades away at 3.8 s */
.ob .intro{position:absolute;inset:0;background:#000;animation:obIntro 4s linear forwards;pointer-events:none}
@keyframes obIntro{0%,88%{opacity:1;visibility:visible}99%{opacity:0;visibility:visible}100%{opacity:0;visibility:hidden}}
.ob .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;opacity:0;animation:obCard 1.9s ease-in-out forwards;animation-delay:var(--at)}
@keyframes obCard{0%{opacity:0;transform:scale(.97)}22%{opacity:1;transform:scale(1)}78%{opacity:1;transform:scale(1.015)}100%{opacity:0;transform:scale(1.02)}}
.ob .card img{width:min(46vw,520px);height:auto}
.ob .card p{margin:0;max-width:min(80vw,680px);text-align:center;font:600 clamp(11px,2vh,17px)/1.6 'Spiderbench Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.ob .card b{font:800 clamp(34px,9vh,90px)/1 'Spiderbench Condensed','Arial Narrow',sans-serif}
/* touch to start: blue sky + drifting clouds (drop assets/ui/splash/sky.webp in to replace the built-in sky) */
.ob .touch{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .7s ease;overflow:hidden;cursor:pointer;
  background:url(/assets/ui/splash/sky.webp) center/cover no-repeat,linear-gradient(180deg,#234f8c 0%,#2f6aa8 45%,#4a86b8 100%)}
.ob.ready .touch{opacity:1;pointer-events:auto}
.ob .touch .cl{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.85),rgba(255,255,255,0) 68%);filter:blur(10px);animation:obDrift 46s linear infinite;will-change:transform}
.ob .touch .cl:nth-child(1){width:70vw;height:34vh;left:-10vw;bottom:-12vh;animation-duration:58s}
.ob .touch .cl:nth-child(2){width:60vw;height:30vh;right:-14vw;bottom:-8vh;opacity:.8;animation-duration:72s;animation-direction:reverse}
.ob .touch .cl:nth-child(3){width:40vw;height:16vh;left:30vw;top:12vh;opacity:.35;animation-duration:90s}
@keyframes obDrift{0%{transform:translate3d(-6vw,0,0)}50%{transform:translate3d(6vw,1.5vh,0)}100%{transform:translate3d(-6vw,0,0)}}
.ob .touch .mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-62%);display:flex;flex-direction:column;align-items:center;gap:3vh}
.ob .touch .mid img{width:min(52vw,600px);height:auto;filter:drop-shadow(0 4px 22px rgba(0,20,60,.35))}
.ob .touch .mid b{font:800 clamp(34px,9vh,90px)/1 'Spiderbench Condensed','Arial Narrow',sans-serif;color:#fff;text-shadow:0 4px 22px rgba(0,20,60,.35)}
.ob .touch .go{font:600 clamp(15px,3.2vh,28px)/1 'Spiderbench Sans',sans-serif;color:#1d3a5f;opacity:.85;animation:obPulse 1.8s ease-in-out infinite}
@keyframes obPulse{0%,100%{opacity:.35}50%{opacity:.95}}
.ob.ready{cursor:pointer}
@media (prefers-reduced-motion:reduce){.ob .asset ul{animation-duration:calc(var(--n) * 1.2s)}.ob .touch .cl{animation:none}}
</style>
</head>
<body>
<script>
// Overpeak-style loader (window.__ob) + startup progress (window.__boot).
//   __ob.create({id, intro})  -> {el, progress(0..1), close()}   the black / red-bar loader. Startup uses it with intro cards;
//                                the Play button builds another one (src/ui/menus/mainmenu.js).
//   __boot.stage(name) -> Promise (resolves after the bar painted)   __boot.sub(0..1) progress inside the stage
//   __boot.done()      shows "Touch to Start"; a tap / key fades the screen out and removes it
// Stage durations are remembered per machine (localStorage 'spiderbench.boot2'): the bar eases toward the expected end of the
// current stage on the compositor, so it keeps moving while a stage blocks the main thread. ?shot / ?playtest / ?noboot: no screen.
(() => {
  const LOGO = '/assets/ui/menu/logo.png';
  const MO = !!window.__MENU_ONLY, GO = !!window.__GO; // MO: first start, no city (only the hero + sky load); GO: Play was pressed, full load then straight into the game
  const NAMES = ['spiderman.glb','walls_col.jpg','walls_nrm.webp','walls_hao.jpg','asphalt_col.png','asphalt_nrm.png','asphalt_macro.png','asphalt_decals.webp',
    'sidewalk_col.png','sidewalk_nrm.png','roof_col.png','roof_nrm.png','grass_col.png','grass_nrm.png','water_nrm.png','curb_col.webp','bark_col.webp','bark_nrm.webp',
    'leaves.png','detail_nrm.png','noise.png','markings.png','signs.png','interiors.png','vehicles.glb','vehicles_atlas.png','vehicles_atlas2.webp','props.glb',
    'peds_atlas.webp','people_bake.webp','people.bin','neon_words.webp','city_signart.webp','coast_atlas.webp','roofplants.webp','thug.glb',
    'ts_ads.webp','ts_decals.webp','ts_shops.webp','ts_ticker.webp','ts_road.webp','ts_pavers.webp','ts_signs.webp','ts_foliage.webp','ts_spill.png',
    'music_orch_swing.ogg','sfx_trav.ogg','sfx_ui.ogg','spiderbench-condensed-800.ttf'];
  const imgFallback = 'onerror="this.replaceWith(Object.assign(document.createElement(\'b\'),{textContent:\'SPIDERBENCH\'}))"';
  const logoImg = cls => `<img class="${cls}" src="${LOGO}" alt="" draggable="false" ${imgFallback}>`;
  const NAMES_MENU = ['spiderman.glb', 'suit_normal.png', 'suit_weave_hex.png', 'suit_weave_knit.png', 'logo.png', 'play.png', 'options.png', 'profile.png', 'photo.png', 'news.png', 'sfx_ui.ogg', 'spiderbench-condensed-800.ttf'];
  function create({ id = '', intro = false, menu = false } = {}) {
    const el = document.createElement('div'); el.className = 'ob'; if (id) el.id = id;
    const NAMES_ = menu ? NAMES_MENU : NAMES, n = NAMES_.length, d = -(Math.random() * n * 0.42).toFixed(2) + 's';
    el.innerHTML = `<div class="asset" style="--n:${n};--d:${d}"><ul>${NAMES_.map(x => `<li>${x}</li>`).join('')}</ul></div>
      <div class="logo">${logoImg('base')}<div class="fill">${logoImg('')}</div></div>
      <div class="bar"><i></i></div><div class="msg" role="alert"></div>`
      + (intro ? `<div class="intro"><div class="card" style="--at:.15s">${logoImg('')}</div>
        <div class="card" style="--at:1.95s"><p>A non-commercial fan project and technical demo<br>Not affiliated with Marvel, Disney, Sony or Insomniac Games</p></div></div>
        <div class="touch"><i class="cl"></i><i class="cl"></i><i class="cl"></i><div class="mid">${logoImg('')}<div class="go">Touch to Start</div></div></div>` : '');
    document.body.prepend(el);
    const bar = el.querySelector('.bar i'), fill = el.querySelector('.logo .fill');
    const api = {
      el,
      // ms/ease: how the bar travels to p (the startup uses long eases toward the end of a stage)
      progress(p, ms = 250, ease = 'ease-out') {
        p = Math.max(0, Math.min(1, p));
        bar.style.transition = `transform ${ms | 0}ms ${ease}`; bar.style.transform = `scaleX(${p.toFixed(4)})`;
        fill.style.clipPath = `inset(0 ${((1 - p) * 100).toFixed(1)}% 0 0)`;
      },
      close(ms = 650) { el.classList.add('out'); setTimeout(() => el.remove(), ms + 100); },
    };
    return api;
  }
  window.__ob = { create };

  const q = new URLSearchParams(location.search);
  const noop = () => Promise.resolve();
  if (q.has('shot') || q.has('playtest') || q.has('noboot')) { window.__boot = { stage: noop, sub() {}, done() {} }; return; }
  const L = create({ id: 'boot', intro: !GO, menu: MO }), el = L.el;
  el.setAttribute('role', 'progressbar'); el.setAttribute('aria-label', 'Loading'); el.setAttribute('aria-valuemin', '0'); el.setAttribute('aria-valuemax', '100'); el.setAttribute('aria-valuenow', '0');
  const ORDER = MO ? ['boot', 'player', 'shaders', 'frame'] : ['boot', 'tex', 'gen', 'build', 'ground', 'props', 'life', 'coll', 'player', 'shaders', 'frame'];
  const KEY = MO ? 'spiderbench.boot2m' : 'spiderbench.boot2';
  // defaults (ms) measured on the dev machine; replaced by this machine's last load. (The shader warm-up now runs when Play is pressed.)
  const DEF = { boot: 1400, tex: 800, gen: 4600, build: 7200, ground: 2300, props: 1300, life: 1250, coll: 2400, player: MO ? 1800 : 800, shaders: 900, frame: 1500 };
  let T = { ...DEF }; try { Object.assign(T, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* private mode */ }
  const total = ORDER.reduce((s, k) => s + T[k], 0);
  const startOf = k => ORDER.slice(0, ORDER.indexOf(k)).reduce((s, n) => s + T[n], 0) / total;
  const seen = {}; let cur = null, curAt = 0, frac = 0, act = 0; // act: last sign of progress (stage or sub)
  const set = (f, ms, ease) => { frac = Math.max(frac, Math.min(1, f)); L.progress(frac, ms, ease); el.setAttribute('aria-valuenow', Math.round(frac * 100)); };
  // let the bar paint before the next blocking step: two frames, but never wait on rAF in a background tab (it does
  // not run there and the load would stall until the tab is shown), and never more than 250 ms
  const raf2 = () => new Promise(r => {
    if (document.hidden) { setTimeout(r, 0); return; }
    let done = false; const go = () => { if (!done) { done = true; r(); } };
    requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(go, 0))); setTimeout(go, 250);
  });
  function stage(name) {
    const now = performance.now();
    if (cur) seen[cur] = now - curAt;
    cur = name; curAt = act = now;
    if (!(name in T)) return raf2();
    const s = startOf(name), e = s + T[name] / total;
    set(s, 260, 'ease-out');                                               // catch up to the stage start
    requestAnimationFrame(() => set(s + (e - s) * 0.94, T[name] * 1.15, 'cubic-bezier(.3,.6,.4,1)')); // then creep toward its end
    return raf2();
  }
  function sub(k) { // measured progress inside the current stage
    if (!cur || !(cur in T)) return;
    act = performance.now();
    const s = startOf(cur), e = s + T[cur] / total;
    set(s + (e - s) * Math.max(0, Math.min(1, k)), 180, 'ease-out');
  }
  let finished = false, started = false;
  function start() { // the tap: fade the whole screen out
    if (started || !finished) return; started = true;
    removeEventListener('keydown', onKey, true);
    L.close(700);
  }
  const onKey = e => { if (el.classList.contains('ready') && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); e.stopPropagation(); start(); } };
  function done() {
    if (finished) return; finished = true;
    if (cur) seen[cur] = performance.now() - curAt;
    try { const m = {}; for (const k of ORDER) m[k] = Math.round(seen[k] != null ? (T[k] + 2 * seen[k]) / 3 : T[k]); localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) { /* ignore */ }
    set(1, 300, 'ease-out');
    // Play was pressed on the title screen: no intro cards / Touch to Start. The start-up screen stays up until the game's own
    // loading screen (mainmenu.js play(), above this one) has faded in, then it is released (window.__boot.release())
    if (GO) { window.__boot.release = () => { removeEventListener('keydown', onKey, true); el.remove(); }; return; }
    // wait for the intro cards (4 s) so Touch to Start never cuts them off
    const wait = Math.max(450, 4000 - performance.now());
    setTimeout(() => { el.classList.add('ready'); el.style.cursor = 'pointer'; }, wait);
  }
  el.addEventListener('pointerdown', e => { if (el.classList.contains('ready')) { e.preventDefault(); start(); } });
  addEventListener('keydown', onKey, true);
  window.__boot = { stage, sub, done, get timings() { return { ...seen }; } };
  // a failed start never leaves the screen loading forever. The error message is shown on the screen: at once when it is
  // certainly fatal (no WebGL, a script that failed to load, anything before the first loading stage), otherwise after
  // 8 s without any progress (a harmless error in an optional module while loading carries on is ignored)
  const msgEl = el.querySelector('.msg');
  const showErr = m => { if (finished) return; el.classList.add('err'); el.querySelector('.intro')?.remove(); msgEl.textContent = 'Could not start: ' + (m || 'Unknown error') + ' (details in the browser console)'; };
  const fail = (m, fatal) => { if (finished) return; if (fatal || cur === 'boot') { showErr(m); return; } const at = act; setTimeout(() => { if (act === at) showErr(m); }, 8000); };
  const msgOf = e => String(e?.message || e || '').slice(0, 240);
  addEventListener('error', e => {
    if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') { fail('Could not load ' + (e.target.src || 'a script'), true); return; }
    if (e.target === window || !e.target) { const m = msgOf(e.error) || msgOf(e); fail(m, /webgl|context/i.test(m)); }
  }, true);
  addEventListener('unhandledrejection', e => { const m = msgOf(e.reason); fail(m, /webgl|context/i.test(m)); });
  stage('boot');
})();
</script>
<div id="hud"></div>
<script type="module" src="/src/main.js"></script>
